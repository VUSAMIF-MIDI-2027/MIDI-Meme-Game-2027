name: Deploy

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and check without deploying
        type: boolean
        default: true

permissions:
  contents: read

env:
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
  COMPOSE_PROJECT_NAME: ${{ secrets.COMPOSE_PROJECT_NAME }}

concurrency:
  group: ${{ github.repository }}-production
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: midiMemeGame.WEB

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: midiMemeGame.WEB/package-lock.json

      - run: npm ci

      - name: Check source code
        run: npm run lint -- src

      - name: Generate Next.js types
        run: npx next typegen

      - name: Check TypeScript
        run: npx tsc --noEmit --incremental false

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://naktis.midi.lt' }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate configuration
        run: |
          case "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" in
            pk_live_*) ;;
            *) echo "Set NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY to the production pk_live_ key"; exit 1 ;;
          esac
          docker compose config --quiet

      - name: Build API and website
        run: docker compose build --pull

      - name: Prepare deployment bundle
        run: |
          mkdir -p bundle

          docker compose config --images | sort -u > bundle/images.txt

          mapfile -t images < bundle/images.txt

          docker save "${images[@]}" | gzip > bundle/images.tar.gz

          cp compose.yml bundle/compose.yml

          printf 'NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=%s\nNEXT_PUBLIC_API_BASE_URL=%s\n' \
            "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" \
            "$NEXT_PUBLIC_API_BASE_URL" \
            > bundle/public.env

      - name: Upload deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: deployment-bundle
          path: bundle/
          if-no-files-found: error
          retention-days: 3

  deploy:
    needs: [lint, build]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_dispatch' || !inputs.dry_run)

    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}

    steps:
      - name: Download deployment bundle
        uses: actions/download-artifact@v4
        with:
          name: deployment-bundle
          path: bundle/

      - name: Prepare API runtime configuration
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_AUTHORITY: ${{ vars.CLERK_AUTHORITY }}
          CLERK_AUTHORIZED_PARTY: ${{ vars.CLERK_AUTHORIZED_PARTY || 'https://naktis.midi.lt' }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          from urllib.parse import urlsplit

          secret = os.environ["CLERK_SECRET_KEY"]
          if not re.fullmatch(r"sk_live_[A-Za-z0-9_-]+", secret):
              raise SystemExit("Set CLERK_SECRET_KEY to the production Clerk secret key")

          values = {"Clerk__SecretKey": secret}
          for source, target in [
              ("CLERK_AUTHORITY", "Clerk__Authority"),
              ("CLERK_AUTHORIZED_PARTY", "Clerk__AuthorizedParties__0"),
          ]:
              value = os.environ[source]
              url = urlsplit(value)
              if (not re.fullmatch(r"https://[a-zA-Z0-9.-]+(?::[0-9]+)?", value)
                  or not url.hostname or url.hostname.endswith(".clerk.accounts.dev")):
                  raise SystemExit(source + " must be a production HTTPS origin without a trailing slash")
              values[target] = value

          target = Path("bundle/api.env")
          target.touch(mode=0o600)
          target.chmod(0o600)
          target.write_text("".join(key + "=" + value + "\n" for key, value in values.items()))
          PY

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"

          install -d -m 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<'EOF'
          Host *
              BatchMode yes
              IdentitiesOnly yes
              IdentityFile ~/.ssh/id_ed25519
              StrictHostKeyChecking yes
              ConnectTimeout 15
          EOF

          chmod 600 ~/.ssh/config

      - name: Upload deployment bundle
        run: |
          set -euo pipefail

          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9_./-]+$ ]]
          [[ "$COMPOSE_PROJECT_NAME" =~ ^[a-z0-9][a-z0-9_-]*$ ]]

          release="$DEPLOY_PATH/releases/$GITHUB_SHA"

          ssh "$SSH_USER@$SSH_HOST" "umask 077; mkdir -p '$release'; chmod 700 '$release'"

          scp bundle/images.tar.gz bundle/compose.yml bundle/public.env bundle/api.env \
            "$SSH_USER@$SSH_HOST:$release/"

      - name: Deploy containers
        run: |
          ssh "$SSH_USER@$SSH_HOST" bash -s -- \
            "$DEPLOY_PATH" "$GITHUB_SHA" "$COMPOSE_PROJECT_NAME" <<'REMOTE'
          set -Eeuo pipefail

          deploy_path="$1"
          commit_sha="$2"
          project_name="$3"

          release="$deploy_path/releases/$commit_sha"
          cd "$release"
          test -s api.env
          chmod 600 api.env

          compose=(
              docker compose
              --env-file public.env
              --project-name "$project_name"
              --file compose.yml
          )

          trap '"${compose[@]}" ps -a; "${compose[@]}" logs --no-color --tail=80' ERR

          "${compose[@]}" config --quiet

          gzip -dc images.tar.gz | docker load

          "${compose[@]}" up \
              --detach \
              --no-build \
              --wait \
              --wait-timeout 120

          "${compose[@]}" ps -a

          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:5001/api/health
          curl --fail --silent --show-error --output /dev/null --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:4000/

          rm -- images.tar.gz
          REMOTE